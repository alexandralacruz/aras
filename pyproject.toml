[project]
name = "aras"
version = "0.1.0"
description = ""
authors = [
    {name = "alexandralacruz",email = "alexandra.lacruz@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "ollama (>=0.6.3,<0.7.0)",
    "mcp (>=2.3.0,<3.0.0)",
    "langchain-core (>=1.7.3,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langgraph (>=1.2.18,<2.0.0)",
    "pydantic (>=2.14.2,<3.0.0)"
]

[tool.poetry]
packages = [{include = "aras", from = "src"}]


[tool.poetry.group.dev.dependencies]
ipykernel = "^7.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
